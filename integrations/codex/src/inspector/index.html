<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Zinn task inspector</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				background: var(--color-background-primary, #f4f2ed);
				color: var(--color-text-primary, #282724);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
			}
			header {
				padding: 16px 20px;
				border-bottom: 1px solid #8885;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			header strong {
				font-size: 19px;
			}
			header span {
				flex: 1;
				font-size: 12px;
			}
			button,
			input,
			select {
				font: inherit;
				color: inherit;
				background: transparent;
				border: 1px solid #8888;
				border-radius: 5px;
				padding: 8px 10px;
			}
			button {
				cursor: pointer;
			}
			button:hover {
				background: #8882;
			}
			button:disabled {
				opacity: 0.5;
				cursor: default;
			}
			button:focus-visible,
			input:focus-visible,
			select:focus-visible {
				outline: 2px solid #a08050;
				outline-offset: 2px;
			}
			form {
				display: flex;
				gap: 8px;
				padding: 16px 20px;
			}
			input {
				min-width: 0;
				flex: 1;
			}
			main {
				padding: 8px 20px 20px;
				min-width: 0;
			}
			h1 {
				font-size: 23px;
				line-height: 1.3;
				margin: 8px 0 12px;
				overflow-wrap: anywhere;
			}
			.meta,
			.muted,
			header span,
			#store,
			#status {
				color: var(--color-text-secondary, #777);
				font-size: 12px;
			}
			.description,
			.comment {
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				line-height: 1.55;
			}
			.section {
				margin-top: 24px;
			}
			h2 {
				font-size: 14px;
			}
			.relation {
				display: block;
				margin-bottom: 8px;
				text-align: left;
				max-width: 100%;
				overflow-wrap: anywhere;
			}
			.comment {
				border-top: 1px solid #8885;
				padding-top: 12px;
				margin-top: 12px;
			}
			#store {
				padding: 12px 20px;
				margin: 0;
				border-top: 1px solid #8885;
				overflow-wrap: anywhere;
				font-size: 11px;
			}
			#status {
				padding: 0 20px;
			}
			#status:empty {
				display: none;
			}
			.move-controls {
				padding: 0;
				margin: 16px 0;
				flex-wrap: wrap;
				align-items: end;
			}
			.move-controls label {
				display: grid;
				gap: 4px;
				flex: 1;
				min-width: 0;
				font-size: 14px;
			}
			.move-controls select {
				width: 100%;
				min-width: 0;
			}
			.move-controls button {
				max-width: 100%;
				overflow-wrap: anywhere;
			}
			.move-controls p {
				flex-basis: 100%;
				margin: 0;
			}
			.error {
				color: #ce6550;
			}
			#recent {
				padding: 0 20px 16px;
				border-bottom: 1px solid #8885;
			}
			#recent h2 {
				margin: 4px 0 8px;
			}
			#recent-status {
				margin: 8px 0;
			}
			#recent-list {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.reference {
				text-align: left;
				overflow-wrap: anywhere;
				font-size: 12px;
			}
			.reference.warning {
				color: var(--color-text-warning, #8a5200);
				border-color: var(--color-border-warning, #b77820);
			}
			.reference[aria-current="true"] {
				border-color: #a08050;
				background: #a0805015;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background: var(--color-background-primary, #242422);
					color: var(--color-text-primary, #e9e6de);
				}
				.meta,
				.muted,
				header span,
				#store,
				#status {
					color: var(--color-text-secondary, #bbb6ab);
				}
				.reference.warning {
					color: var(--color-text-warning, #e8b65e);
				}
			}
		</style>
	</head>
	<body>
		<header>
			<strong>Zinn</strong><span>Task inspector</span><button id="refresh" type="button" disabled>Refresh</button>
		</header>
		<form id="lookup">
			<input
				id="key"
				aria-label="Task key"
				placeholder="Task key, e.g. APP-1"
				autocomplete="off"
				spellcheck="false" /><button disabled>Open task</button>
		</form>

		<p id="status" role="status">Connecting to native host…</p>

		<nav id="recent" aria-label="Observed tasks in this chat">
			<h2>Observed in this chat</h2>
			<p id="recent-status" class="muted" role="status">Connecting…</p>
			<div id="recent-list"></div>
		</nav>

		<main id="detail" aria-live="polite"></main>
		<p id="store"></p>
		<!-- WIDGET -->
	</body>
</html>
