name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Read minimum Node version
        id: node-version
        run: |
          bun --eval '
            import { readNodeMinimum } from "./scripts/package-fixture.ts";
            console.log(`version=${readNodeMinimum(process.cwd()).version}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check Node SQLite adapter
        run: bun run test:node

  opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Read minimum Node version
        id: node-version
        run: |
          bun --eval '
            import { readNodeMinimum } from "./scripts/package-fixture.ts";
            console.log(`version=${readNodeMinimum(process.cwd()).version}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: bun install

      - name: Type check inspector
        run: bun run opencode:typecheck

      - name: Run inspector tests
        run: bun run opencode:test

  codex:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Read minimum Node version
        id: node-version
        run: |
          bun --eval '
            import { readNodeMinimum } from "./scripts/package-fixture.ts";
            console.log(`version=${readNodeMinimum(process.cwd()).version}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Record runtime versions
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          node -p '"Node.js " + process.version + " SQLite " + process.versions.sqlite'
          bun --version
          bun -e 'import { Database } from "bun:sqlite"; const db = new Database(":memory:"); console.log("Bun SQLite " + db.query("SELECT sqlite_version() AS version").get().version); db.close();'

      - name: Install repository dependencies
        run: bun install

      - name: Install Codex integration dependencies
        run: bun install --cwd integrations/codex --frozen-lockfile

      - name: Type check Codex integration
        run: bun run codex:typecheck

      - name: Run Codex integration tests
        run: bun run codex:test
